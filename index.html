
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Gotas Personalizado - Alta Retina</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background-color: #f0f4f8; color: #1a202c; padding: 15px; }
        .card { max-width: 650px; margin: 0 auto; background: white; padding: 25px; border-radius: 16px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        .header { text-align: center; border-bottom: 3px solid #3182ce; padding-bottom: 12px; margin-bottom: 15px; }
        h2 { color: #2b6cb0; margin: 0; font-size: 1.4em; }
        .countdown-banner { background: #ebf8ff; color: #2b6cb0; border: 1px solid #bee3f8; border-radius: 8px; padding: 8px 12px; font-weight: bold; font-size: 0.9em; margin-top: 8px; display: inline-block; }
        .meta-info { font-size: 0.85em; color: #4a5568; margin-top: 5px; }
        .live-clock { background: #2b6cb0; color: white; text-align: center; padding: 10px; font-weight: bold; border-radius: 8px; font-size: 1.2em; margin-bottom: 15px; letter-spacing: 1px; }
        .alert-box { background: #fffaf0; border-left: 4px solid #dd6b20; padding: 12px; border-radius: 6px; margin-bottom: 20px; font-size: 0.95em; line-height: 1.4; }
        .danger-box { background: #fff5f5; border: 1px solid #fed7d7; color: #9b2c2c; padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 0.85em; }
        .row-med { display: flex; align-items: center; justify-content: space-between; padding: 14px 10px; border-bottom: 1px solid #e2e8f0; }
        .row-med.checked { background-color: #f0fff4; opacity: 0.65; }
        .row-med.checked .m-time, .row-med.checked .m-list { text-decoration: line-through; color: #38a169; }
        .m-time { font-weight: bold; color: #2d3748; width: 80px; font-size: 1em; }
        .m-list { flex-grow: 1; padding-left: 10px; font-size: 0.95em; }
        .m-tag { font-size: 0.75em; background: #e2e8f0; color: #4a5568; padding: 2px 6px; border-radius: 4px; font-weight: bold; margin-left: 5px; display: inline-block; }
        .m-tag.shake { background: #c6f6d5; color: #22543d; }
        input[type="checkbox"] { width: 22px; height: 22px; cursor: pointer; }
        .btn-action { display: block; width: 100%; background: #4a5568; color: white; border: none; padding: 12px; margin-top: 15px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 0.95em; }
        .btn-action:hover { background: #2d3748; }
        .btn-cal { background: #2b6cb0; margin-bottom: 15px; }
        .btn-cal:hover { background: #2c5282; }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <h2>⏱️ Control de Medicación Posoperatoria</h2>
            <div class="countdown-banner" id="cuentaRegresivaDias">⏳ Cargando tiempo restante...</div>
            <div class="meta-info">Fase Crítica Posoperatoria | Alta Retina</div>
        </div>
        
        <button class="btn-action btn-cal" onclick="exportarACalendario()">📅 Agendar Alertas en Calendario de iPhone</button>

        <div class="danger-box">
            🚨 <b>Datos de alarma (Ir a Urgencias si presenta):</b> Dolor Intenso • Secreción Amarilla/Verde • Baja Visual repentina.
        </div>

        <div class="live-clock" id="reloj">--:--:--</div>
        <div class="alert-box" id="panelAlerta">Calculando próximos horarios...</div>
        
        <div id="listaMedicamentos"></div>
        
        <button class="btn-action" onclick="reiniciarProgreso()">Reiniciar Checklist del Día</button>
    </div>

    <script>
        const CLAVE_FECHA_FIN = 'fechaFinTratamiento5Dias';
        let fechaFin = localStorage.getItem(CLAVE_FECHA_FIN);

        if (!fechaFin) {
            const limite = new Date();
            limite.setDate(limite.getDate() + 5);
            fechaFin = limite.getTime();
            localStorage.setItem(CLAVE_FECHA_FIN, fechaFin);
        } else {
            fechaFin = parseInt(fechaFin, 10);
        }

        function actualizarCuentaRegresivaDias() {
            const ahora = new Date().getTime();
            const diferencia = fechaFin - ahora;
            const banner = document.getElementById('cuentaRegresivaDias');

            if (diferencia <= 0) {
                banner.innerText = '🏁 ¡Periodo de 5 días completado!';
                banner.style.backgroundColor = '#c6f6d5';
                banner.style.color = '#22543d';
                return;
            }

            const dias = Math.floor(diferencia / (1000 * 60 * 60 * 24));
            const horas = Math.floor((diferencia % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutos = Math.floor((diferencia % (1000 * 60 * 60)) / (1000 * 60));
            const segundos = Math.floor((diferencia % (1000 * 60)) / 1000);

            banner.innerText = `⏳ Tiempo restante del tratamiento (5 Días): ${dias}d ${horas}h ${minutos}m ${segundos}s`;
        }

        const horarioBase = [
            { id: 6, hora: "06:00", gotas: ["Prednisona (Caja Verde)", "Tobramicina (Caja Roja)", "Systone Complete (Caja Morada)"], agitar: true },
            { id: 7, hora: "06:30", gotas: ["Tromicamida, Fenilefrina (Caja blanco, amarillo y azul)"], agitar: false },
            { id: 8, hora: "07:00", gotas: ["Prednisona (Caja Verde)"], agitar: true },
            { id: 9, hora: "08:00", gotas: ["Prednisona (Caja Verde)"], agitar: true },
            { id: 10, hora: "09:00", gotas: ["Prednisona (Caja Verde)"], agitar: true },
            { id: 11, hora: "10:00", gotas: ["Prednisona (Caja Verde)", "Tobramicina (Caja Roja)"], agitar: true },
            { id: 12, hora: "11:00", gotas: ["Prednisona (Caja Verde)"], agitar: true },
            { id: 13, hora: "12:00", gotas: ["Prednisona (Caja Verde)", "Brimonidina, Timolol (Caja blanco con Rosa)", "Systone Complete (Caja Morada)"], agitar: true },
            { id: 14, hora: "13:00", gotas: ["Prednisona (Caja Verde)"], agitar: true },
            { id: 15, hora: "14:00", gotas: ["Prednisona (Caja Verde)", "Tobramicina (Caja Roja)"], agitar: true },
            { id: 16, hora: "14:30", gotas: ["Tromicamida, Fenilefrina (Caja blanco, amarillo y azul)"], agitar: false },
            { id: 17, hora: "15:00", gotas: ["Prednisona (Caja Verde)"], agitar: true },
            { id: 18, hora: "16:00", gotas: ["Prednisona (Caja Verde)"], agitar: true },
            { id: 19, hora: "17:00", gotas: ["Prednisona (Caja Verde)"], agitar: true },
            { id: 20, hora: "18:00", gotas: ["Prednisona (Caja Verde)", "Tobramicina (Caja Roja)", "Systone Complete (Caja Morada)"], agitar: true },
            { id: 21, hora: "19:00", gotas: ["Prednisona (Caja Verde)"], agitar: true },
            { id: 22, hora: "20:00", gotas: ["Prednisona (Caja Verde)"], agitar: true },
            { id: 23, hora: "21:00", gotas: ["Prednisona (Caja Verde)"], agitar: true },
            { id: 24, hora: "22:00", gotas: ["Prednisona (Caja Verde)", "Tobramicina (Caja Roja)"], agitar: true },
            { id: 25, hora: "22:30", gotas: ["Tromicamida, Fenilefrina (Caja blanco, amarillo y azul)"], agitar: false },
            { id: 26, hora: "23:00", gotas: ["Prednisona (Caja Verde)"], agitar: true },
            { id: 27, hora: "00:00", gotas: ["Brimonidina, Timolol (Caja blanco con Rosa)", "Systone Complete (Caja Morada)"], agitar: false }
        ];

        let progreso = JSON.parse(localStorage.getItem('gotasFase2')) || {};

        function formatearFechaICS(fecha) {
            return fecha.toISOString().replace(/-|:|\.\d+/g, '');
        }

        function exportarACalendario() {
            const hoy = new Date();
            let contenidoICS = [
                "BEGIN:VCALENDAR",
                "VERSION:2.0",
                "PRODID:-//Alta Retina//Control Gotas//ES",
                "CALSCALE:GREGORIAN",
                "METHOD:PUBLISH"
            ];

            // Genera eventos para el día de hoy con sus respectivas alarmas
            horarioBase.forEach(item => {
                const [horas, minutos] = item.hora.split(':').map(Number);
                
                let fechaInicio = new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate(), horas, minutos, 0);
                let fechaFinEvento = new Date(fechaInicio.getTime() + 5 * 60000); // Duración de 5 min

                // Si la toma es a las 00:00, corresponde al inicio del siguiente día
                if (horas === 0) {
                    fechaInicio.setDate(fechaInicio.getDate() + 1);
                    fechaFinEvento.setDate(fechaFinEvento.getDate() + 1);
                }

                const dtStart = formatearFechaICS(fechaInicio);
                const dtEnd = formatearFechaICS(fechaFinEvento);
                const titulo = `👁️ Aplicar Gotas: ${item.gotas.join(' + ')}`;
                const descripcion = `Esquema Posoperatorio Alta Retina.\\nGotas: ${item.gotas.join(', ')}`;

                contenidoICS.push(
                    "BEGIN:VEVENT",
                    `UID:gotas-${item.id}-${dtStart}@altaretina`,
                    `DTSTAMP:${formatearFechaICS(hoy)}`,
                    `DTSTART:${dtStart}`,
                    `DTEND:${dtEnd}`,
                    `SUMMARY:${titulo}`,
                    `DESCRIPTION:${descripcion}`,
                    "BEGIN:VALARM",
                    "ACTION:DISPLAY",
                    "TRIGGER:-PT0M", // Alarma a la hora exacta
                    `DESCRIPTION:Recordatorio de Gotas`,
                    "END:VALARM",
                    "END:VEVENT"
                );
            });

            contenidoICS.push("END:VCALENDAR");

            const blob = new Blob([contenidoICS.join("\r\n")], { type: "text/calendar;charset=utf-8" });
            const enlace = document.createElement("a");
            enlace.href = window.URL.createObjectURL(blob);
            enlace.setAttribute("download", "Horarios_Gotas_AltaRetina.ics");
            document.body.appendChild(enlace);
            enlace.click();
            document.body.removeChild(enlace);
        }

        function actualizarDinamismo() {
            const ahora = new Date();
            const h = String(ahora.getHours()).padStart(2, '0');
            const m = String(ahora.getMinutes()).padStart(2, '0');
            const s = String(ahora.getSeconds()).padStart(2, '0');
            
            document.getElementById('reloj').innerText = `HORA EN VIVO: ${h}:${m}:${s}`;
            
            const minutosActuales = ahora.getHours() * 60 + ahora.getMinutes();
            let proximoBloque = null;
            let difMinima = Infinity;

            horarioBase.forEach(item => {
                if (!progreso[item.id]) {
                    const [sh, sm] = item.hora.split(':').map(Number);
                    let minMed = sh * 60 + sm;
                    let dif = minMed - minutosActuales;

                    if (dif < 0) dif += 1440;
                    if (dif < difMinima) {
                        difMinima = dif;
                        proximoBloque = item;
                    }
                }
            });

            const alertDiv = document.getElementById('panelAlerta');
            if (proximoBloque) {
                const hRestantes = Math.floor(difMinima / 60);
                const mRestantes = difMinima % 60;
                let cuentaAtras = hRestantes > 0 ? `${hRestantes}h ${mRestantes}min` : `${mRestantes} min`;
                
                let advertenciaMultigota = proximoBloque.gotas.length > 1 ? 
                    `<br/><b style="color:#c05621;">⚠️ Coinciden ${proximoBloque.gotas.length} gotas. Aplicar separadas por 5 MINUTOS obligatorios.</b>` : '';

                alertDiv.innerHTML = `<b>Próxima Alerta médica:</b> En <b>${cuentaAtras}</b> (${proximoBloque.hora})<br/>
                                      <span style="color:#2b6cb0;">• Dosis: ${proximoBloque.gotas.join(' + ')}</span>${advertenciaMultigota}`;
            } else {
                alertDiv.innerHTML = `🎉 <b>¡Horarios de Hoy Completados!</b> Modo descanso nocturno activo (máx 6h sin gotas).`;
            }

            actualizarCuentaRegresivaDias();
        }

        function construirInterfaz() {
            const cont = document.getElementById('listaMedicamentos');
            cont.innerHTML = '';

            horarioBase.forEach(item => {
                const fila = document.createElement('div');
                fila.className = `row-med ${progreso[item.id] ? 'checked' : ''}`;
                
                let medicamentosHTML = item.gotas.map(g => {
                    let esAgitable = g.includes("Prednisona") ? '<span class="m-tag shake">👋 Agitar</span>' : '';
                    return `• ${g} ${esAgitable}`;
                }).join('<br/>');

                let multitag = item.gotas.length > 1 ? '<span class="m-tag" style="background:#edf2f7; color:#2b6cb0;">⏱️ Esperar 5min entre gotas</span>' : '';

                fila.innerHTML = `
                    <div class="m-time">${item.hora}</div>
                    <div class="m-list">${medicamentosHTML} ${multitag}</div>
                    <div><input type="checkbox" ${progreso[item.id] ? 'checked' : ''} onchange="marcarFila(${item.id}, this.checked)"></div>
                `;
                cont.appendChild(fila);
            });
        }

        function marcarFila(id, completado) {
            if (completado) progreso[id] = true;
            else delete progreso[id];
            localStorage.setItem('gotasFase2', JSON.stringify(progreso));
            construirInterfaz();
            actualizarDinamismo();
        }

        function reiniciarProgreso() {
            if(confirm("¿Desea limpiar el checklist del día de hoy?")) {
                progreso = {};
                localStorage.removeItem('gotasFase2');
                construirInterfaz();
                actualizarDinamismo();
            }
        }

        construirInterfaz();
        actualizarDinamismo();
        setInterval(actualizarDinamismo, 1000);
    </script>
</body>
</html>
